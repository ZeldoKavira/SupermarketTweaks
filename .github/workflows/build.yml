name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write        # needed to publish the rolling release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # The mod compiles against BepInEx and against the game's assemblies. The game obviously
      # isn't here, so refs/Managed holds stripped reference assemblies (metadata only, no method
      # bodies) generated by refs/update-refs.ps1. BepInEx is small enough to just fetch.
      - name: Fetch BepInEx
        shell: pwsh
        run: |
          $url = 'https://github.com/BepInEx/BepInEx/releases/download/v5.4.23.3/BepInEx_win_x64_5.4.23.3.zip'
          Invoke-WebRequest -Uri $url -OutFile bepinex.zip
          Expand-Archive bepinex.zip -DestinationPath bepinex -Force

      - name: Build
        shell: pwsh
        run: |
          dotnet build SupermarketTweaks/SupermarketTweaks.csproj -c Release `
            -p:ManagedDir="$env:GITHUB_WORKSPACE\refs\Managed" `
            -p:BepInExCore="$env:GITHUB_WORKSPACE\bepinex\BepInEx\core"

      - uses: actions/upload-artifact@v4
        with:
          name: SupermarketTweaks
          path: SupermarketTweaks/bin/Release/SupermarketTweaks.dll
          if-no-files-found: error

      # Every push to main also becomes a rolling release, which is what the updater script on
      # another PC actually downloads - artifacts need auth and expire, release assets don't.
      - name: Publish rolling release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # No 'latest' release exists on the first run; that is not a failure.
          gh release delete latest --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0
          gh release create latest SupermarketTweaks/bin/Release/SupermarketTweaks.dll `
            --title "Latest build" `
            --notes "Automatic build of $env:GITHUB_SHA"
